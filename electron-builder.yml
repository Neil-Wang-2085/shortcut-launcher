appId: com.neil.shortcutlauncher
productName: Shortcut Launcher
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - dist/**/*
  - assets/**/*
  - examples/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shortcut Launcher
portable:
  artifactName: ShortcutLauncher-${version}-portable.exe
